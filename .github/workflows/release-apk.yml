name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (vX.Y.Z). Leave empty on a tag run. On a branch, empty uses v<version> from package.json."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}-${{ inputs.tag || 'auto' }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1" \
            "cmake;3.30.5"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test -- --ci --watchman=false

      - name: Prebuild Android project
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild -p android --clean

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/configure-release-signing.sh

      - name: Raise Gradle heap for release dexing
        run: |
          set -euo pipefail
          # Expo's prebuild template sets -Xmx2048m. On GitHub-hosted runners that
          # heap is exhausted by R8 in :app:mergeDexRelease (Java heap space).
          # 4g fits a 16 GB runner; native compilation has already peaked by then.
          props=android/gradle.properties
          line='org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
          if grep -q '^org\.gradle\.jvmargs=' "$props"; then
            sed -i "s/^org\\.gradle\\.jvmargs=.*/${line}/" "$props"
          else
            printf '\n%s\n' "$line" >> "$props"
          fi
          grep -q '^org\.gradle\.jvmargs=-Xmx4g ' "$props"
          grep '^org\.gradle\.jvmargs=' "$props"

      - name: Build universal release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Collect APK asset
        id: apk
        run: |
          set -euo pipefail
          src="android/app/build/outputs/apk/release/app-release.apk"
          dest="android/app/build/outputs/apk/release/DevSettingsWidget-universal.apk"
          test -f "$src"
          # Write the listing first. `unzip | grep -q` trips pipefail (SIGPIPE) on GitHub runners.
          unzip -l "$src" > /tmp/apk-listing.txt
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if ! grep -q "lib/${abi}/" /tmp/apk-listing.txt; then
              echo "Expected lib/${abi}/ inside the universal APK." >&2
              grep 'lib/' /tmp/apk-listing.txt || true
              exit 1
            fi
          done
          cp "$src" "$dest"
          bytes=$(stat -c%s "$dest")
          echo "APK bytes: $bytes"
          ls -lh "$dest"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          echo "name=DevSettingsWidget-universal.apk" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            ver="$(node -p "require('./package.json').version")"
            tag="v${ver}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to publish tag '$tag'. Use a vX.Y.Z tag (optional prerelease suffix)." >&2
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: DevSettings Widget ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            Install on the phone: download **DevSettingsWidget-universal.apk** below (one APK, all ABIs) and follow the Samsung steps in the [README](https://github.com/phuocthinh-boonievn/DevSettingsWidget#install).

            Direct download: https://github.com/phuocthinh-boonievn/DevSettingsWidget/releases/latest/download/DevSettingsWidget-universal.apk

            Signing: if repository secrets `ANDROID_KEYSTORE_BASE64`, `ANDROID_KEYSTORE_PASSWORD`, `ANDROID_KEY_ALIAS`, and `ANDROID_KEY_PASSWORD` are all set, this APK is signed with that key. Otherwise it is signed with the Android debug keystore so it is still installable. Switching from the debug key to a real key later changes the signature — uninstall the old app before installing the new APK.
