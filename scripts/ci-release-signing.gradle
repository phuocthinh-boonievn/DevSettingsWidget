/**
 * Applied from android/app/build.gradle by the release workflow when a real
 * upload keystore is available. Without ANDROID_KEYSTORE_FILE the Expo
 * template keeps signing release with the debug keystore, which is still
 * installable.
 *
 * Expected environment:
 *   ANDROID_KEYSTORE_FILE
 *   ANDROID_KEYSTORE_PASSWORD
 *   ANDROID_KEY_ALIAS
 *   ANDROID_KEY_PASSWORD
 */
def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
if (keystorePath) {
    def store = file(keystorePath)
    if (!store.isFile()) {
        throw new GradleException("ANDROID_KEYSTORE_FILE is not a file: " + keystorePath)
    }
    def storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def keyAlias = System.getenv("ANDROID_KEY_ALIAS")
    def keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
    if (!storePassword || !keyAlias || !keyPassword) {
        throw new GradleException("ANDROID_KEYSTORE_FILE is set but the keystore password, key alias, or key password is missing.")
    }
    android.signingConfigs.create("release")
    android.signingConfigs.release.storeFile = store
    android.signingConfigs.release.storePassword = storePassword
    android.signingConfigs.release.keyAlias = keyAlias
    android.signingConfigs.release.keyPassword = keyPassword
    android.buildTypes.release.signingConfig = android.signingConfigs.release
    logger.lifecycle("Release APK will be signed with alias '" + keyAlias + "'.")
}
